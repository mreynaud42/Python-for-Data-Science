
[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ft_package"
version = "0.0.1"
description = "A sample test package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "mreynaud"},
    {email = "mreynaud@42Lyon.fr" }
]

[project.urls]
Homepage = "https://github.com/mreynaud/ft_package"

[tool.setuptools.packages.find]
where = ["."]
include = ["ft_package*"]
